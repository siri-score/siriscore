name: Vercel Preview Comment

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment-preview-url:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      deployments: read

    steps:
      - name: Wait for Vercel preview deployment
        uses: actions/github-script@v7
        id: preview
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const timeout = 180_000;
            const interval = 10_000;
            const start = Date.now();

            while (Date.now() - start < timeout) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha,
              });

              for (const deployment of deployments) {
                if (deployment.production_environment) continue;
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id,
                });
                const latest = statuses[0];
                if (latest?.state === 'success' && latest.environment_url) {
                  core.setOutput('url', latest.environment_url);
                  return;
                }
              }

              await new Promise(r => setTimeout(r, interval));
            }

            core.warning('Timed out waiting for Vercel preview, check Vercel dashboard');
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body: '<!-- vercel-preview-comment -->\n## Preview Deployment\n\n_Timed out waiting for Vercel preview. Check the [Vercel dashboard](https://vercel.com) for deployment status._',
            });

      - name: Post preview URL comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- vercel-preview-comment -->';
            const body = `${marker}\n## Preview Deployment\n\n**${url}**\n\n_Refreshes on every push to this PR._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
